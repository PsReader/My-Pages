<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#ffe16b" />
    <title>Page Not Found | Little Detour</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #fffaf0; color: #242235; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 560px); padding: clamp(28px, 7vw, 52px); border: 2px solid #242235; border-radius: 24px; background: #fffdf7; box-shadow: 8px 8px 0 #242235; }
      p { color: #4c4a5d; line-height: 1.6; }
      .eyebrow { color: #4354d8; font-size: .8rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 12px 0; font-size: clamp(2rem, 8vw, 3.4rem); line-height: 1.05; }
      a { display: inline-flex; min-height: 48px; align-items: center; margin-top: 12px; padding: 0 18px; border: 2px solid #242235; border-radius: 12px; background: #d9ec78; color: #242235; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #4354d8; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Little Detour · 404</p>
      <h1>This page took a wrong turn.</h1>
      <p>The address does not lead to an activity. Head back to the wheel and pick a new one.</p>
      <a href="/">Back to Little Detour</a>
    </main>
  </body>
</html>
