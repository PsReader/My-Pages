<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#d8c9aa">
<title>503 | Service unavailable | Arcana Memory Rite</title>
<meta name="description" content="HTTP 503 error page for Arcana Memory Rite. The service is unavailable right now. Wait a moment, then try again.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--bg:#d8c9aa;--panel:#e9dcc0;--paper:#efe3c7;--cream:#f4ead5;--ink:#211b16;--gold:#5b4632;--muted:#6f6252;--rose:#8f2f2b;--line:rgba(91,70,50,.32)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
main{max-width:560px;padding:40px 34px;border:1px solid var(--line);border-radius:10px;background:var(--paper);box-shadow:0 12px 32px rgba(61,44,32,.14)}
.kicker{margin:0 0 10px;color:var(--rose);font-family:'Courier New',monospace;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
h1{margin:0 0 12px;font-size:clamp(1.8rem,5.5vw,2.4rem);letter-spacing:-.02em;line-height:1.15}
p{margin:0 0 26px;color:var(--muted);line-height:1.65}
.links{display:flex;flex-wrap:wrap;gap:10px}
a{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:1px solid var(--gold);border-radius:8px;color:var(--ink);background:var(--panel);font-family:Georgia,serif;font-size:.92rem;font-weight:700;text-decoration:none}
a.primary{color:var(--cream);background:var(--gold)}
a:hover{border-color:var(--rose)}
a:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <p class="kicker">Arcana Memory Rite / 503</p>
  <h1>This site is temporarily unavailable.</h1>
  <p>The service is unavailable right now. Wait a moment, then try again.</p>
  <div class="links">
    <a class="primary" href="/index.html">Back to the game</a>
  </div>
</main>
</body>
</html>
