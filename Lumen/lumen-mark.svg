<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Lumen mark</title>
  <desc id="desc">Two glowing color orbs connected by a warm signal beam</desc>
  <defs>
    <linearGradient id="beam" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#dbe5e7"/>
      <stop offset=".5" stop-color="#dcb276"/>
      <stop offset="1" stop-color="#fffdf8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#17212b"/>
  <path d="M17 32h30" fill="none" stroke="url(#beam)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="17" cy="32" r="8" fill="#dbe5e7" stroke="#fffdf8" stroke-width="1.5"/>
  <circle cx="47" cy="32" r="8" fill="#fffdf8" stroke="#dcb276" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="2.5" fill="#dcb276"/>
</svg>
