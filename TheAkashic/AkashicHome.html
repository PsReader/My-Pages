<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Akashic - Scratchpad</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-content">
          <h1>The Akashic</h1>
          <p class="subtitle">Your Personal Scratchpad</p>
        </div>
        <div class="header-info">
          <span class="char-count" id="charCount">0</span> characters
          <button id="clearBtn" class="clear-btn" title="Clear all notes">
            Clear
          </button>
        </div>
      </header>

      <main>
        <textarea
          id="notepad"
          placeholder="Write your thoughts, ideas, and notes here... They'll be saved automatically as you type."
          spellcheck="true"
        ></textarea>
      </main>

      <footer
        style="
          background: rgba(24, 13, 31, 0.95);
          border-top: 1px solid rgba(255, 255, 255, 0.08);
          padding: 18px 16px;
          text-align: center;
          color: #f8ebff;
          font-size: 0.95rem;
        "
      >
        <p style="margin: 0 0 8px">
          💾 Saved automatically to your browser | No backend, no accounts
          needed.
        </p>
        <p style="margin: 0 0 8px">
          &copy; 2026 The Akashic Scratchpad. Local-only storage; no server data
          is collected.
        </p>
        <p style="margin: 0" class="last-saved" id="lastSaved"></p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
