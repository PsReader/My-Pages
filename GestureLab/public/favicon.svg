<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GestureLab favicon">
  <title>GestureLab</title>

  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#202A52"/>
      <stop offset="100%" stop-color="#0B0E1C"/>
    </radialGradient>
    <linearGradient id="handGrad" gradientUnits="userSpaceOnUse" x1="120" y1="60" x2="272" y2="250">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#6EB0FF"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- Hand mark, scaled to fit -->
  <g transform="translate(32 33) scale(0.235) translate(-185 -155)">
    <rect x="140" y="150" width="132" height="100" rx="20" fill="url(#handGrad)"/>
    <rect x="244" y="74" width="24" height="104" rx="12" fill="url(#handGrad)"/>
    <rect x="212" y="60" width="24" height="118" rx="12" fill="url(#handGrad)"/>
    <rect x="180" y="68" width="24" height="110" rx="12" fill="url(#handGrad)"/>
    <rect x="148" y="78" width="24" height="100" rx="12" fill="url(#handGrad)"/>
    <rect x="120" y="86" width="24" height="90" rx="12" transform="rotate(-14 132 172)" fill="url(#handGrad)"/>
  </g>

  <!-- Reticle, drawn in favicon space -->
  <g fill="none" stroke-linecap="round">
    <circle cx="32" cy="33" r="8.5" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="1.4"/>
    <circle cx="32" cy="33" r="5.5" stroke="#5EEAD4" stroke-opacity="0.95" stroke-width="1.1"/>
    <line x1="32" y1="21" x2="32" y2="24" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.4"/>
    <line x1="32" y1="42" x2="32" y2="45" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.4"/>
    <line x1="20" y1="33" x2="23" y2="33" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.4"/>
    <line x1="41" y1="33" x2="44" y2="33" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.4"/>
  </g>
  <circle cx="32" cy="33" r="1.6" fill="#5EEAD4"/>
</svg>
