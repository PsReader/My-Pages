<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>Page not found | Type Bound</title>
<meta name="description" content="That page does not exist. Return to the Type Bound typing challenge.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<style>
:root{--paper:#e9e4d8;--paper-2:#f4f0e7;--ink:#171717;--line:#3c3b38;--verm:#f15a3a;--cream:#f7f2e8;--shadow:6px 7px 0 rgba(23,23,23,.94)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:var(--ink);background:var(--paper);font-family:'Space Grotesk',Arial,sans-serif}
main{max-width:560px;padding:38px 32px;border:1px solid var(--line);background:var(--paper-2);box-shadow:var(--shadow)}
.kicker{margin:0 0 10px;color:var(--verm);font-family:'DM Mono',ui-monospace,Consolas,monospace;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
h1{margin:0 0 12px;font-size:clamp(1.8rem,5.5vw,2.4rem);letter-spacing:-.03em;line-height:1.12}
p{margin:0 0 26px;line-height:1.65}
.links{display:flex;flex-wrap:wrap;gap:12px}
a{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:1px solid var(--ink);color:var(--ink);background:var(--cream);font-size:.9rem;font-weight:700;text-decoration:none}
a.primary{border-color:var(--verm);color:#fff;background:var(--verm)}
a:hover{border-color:var(--verm)}
a:focus-visible{outline:3px solid var(--verm);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <p class="kicker">Type Bound / 404</p>
  <h1>No page at that address.</h1>
  <p>Your local scores and history are still in this browser. Head back and keep typing.</p>
  <div class="links">
    <a class="primary" href="./index.html">Back to Type Bound</a>
  </div>
</main>
</body>
</html>
