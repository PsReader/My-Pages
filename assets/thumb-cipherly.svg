<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-labelledby="title description">
  <title id="title">Cipherly password generator preview</title>
  <desc id="description">A password utility preview with Cipherly's forest green and gold identity, a password field, and generator controls.</desc>
  <!-- Design reason: a compact generator preview makes Cipherly recognizable beside the workspace's real project screenshots. -->
  <rect width="1000" height="800" fill="#f2eee5"/>
  <path d="M0 112h1000" stroke="#d9d3c6" stroke-width="2"/>
  <g transform="translate(54 34)">
    <rect width="44" height="44" rx="12" fill="#24352e"/>
    <path d="M30 13a12 12 0 1 0 0 18m0-18 5-4m-5 22 5 4" fill="none" stroke="#e7bb70" stroke-width="3" stroke-linecap="round"/>
    <circle cx="22" cy="19" r="3.5" fill="#fff8e9"/>
    <path d="M20 22v11h5v-6h4" fill="none" stroke="#fff8e9" stroke-width="3" stroke-linejoin="round"/>
    <text x="58" y="29" fill="#24352e" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="2">cipherly</text>
    <text x="790" y="28" fill="#65736b" font-family="Arial,sans-serif" font-size="13" letter-spacing="1.5">PASSWORD MAKER</text>
  </g>
  <text x="66" y="196" fill="#9a7847" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">PRIVATE UTILITY / PASSWORD MAKER</text>
  <text x="66" y="284" fill="#24352e" font-family="Georgia,serif" font-size="57">Good security</text>
  <text x="66" y="351" fill="#24352e" font-family="Georgia,serif" font-size="57">starts with a</text>
  <text x="66" y="418" fill="#b18442" font-family="Georgia,serif" font-size="57" font-style="italic">better key.</text>
  <text x="68" y="478" fill="#59645e" font-family="Arial,sans-serif" font-size="18">Make a password, passphrase, or private batch</text>
  <text x="68" y="506" fill="#59645e" font-family="Arial,sans-serif" font-size="18">in your browser.</text>
  <rect x="68" y="548" width="205" height="58" rx="8" fill="#24352e"/>
  <text x="94" y="584" fill="#fff8e9" font-family="Arial,sans-serif" font-size="17" font-weight="700">Make a password</text>
  <text x="68" y="677" fill="#66736b" font-family="Arial,sans-serif" font-size="13" letter-spacing="1.4">BROWSER-BASED GENERATION</text>
  <g transform="translate(548 158)">
    <rect width="388" height="494" rx="18" fill="#24352e"/>
    <rect x="20" y="20" width="348" height="40" rx="7" fill="#1c2b25"/>
    <text x="40" y="46" fill="#d5c9ad" font-family="monospace" font-size="12" letter-spacing="1">cipherly / fresh key</text>
    <circle cx="338" cy="40" r="6" fill="#e7bb70"/>
    <text x="30" y="114" fill="#e7bb70" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">YOUR PASSWORD</text>
    <rect x="26" y="135" width="336" height="86" rx="9" fill="#f2eee5"/>
    <text x="46" y="188" fill="#24352e" font-family="monospace" font-size="25" font-weight="700">G7!qv_2m#L8z@p</text>
    <text x="30" y="273" fill="#e7bb70" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">SET THE RULES</text>
    <text x="30" y="312" fill="#fff8e9" font-family="Arial,sans-serif" font-size="16">Length</text>
    <text x="320" y="312" fill="#fff8e9" font-family="monospace" font-size="16">16</text>
    <rect x="30" y="328" width="328" height="8" rx="4" fill="#53645a"/>
    <rect x="30" y="328" width="210" height="8" rx="4" fill="#e7bb70"/>
    <text x="30" y="382" fill="#fff8e9" font-family="Arial,sans-serif" font-size="15">Include uppercase</text>
    <rect x="320" y="365" width="38" height="22" rx="11" fill="#e7bb70"/>
    <circle cx="347" cy="376" r="8" fill="#24352e"/>
    <text x="30" y="423" fill="#fff8e9" font-family="Arial,sans-serif" font-size="15">Include numbers</text>
    <rect x="320" y="406" width="38" height="22" rx="11" fill="#e7bb70"/>
    <circle cx="347" cy="417" r="8" fill="#24352e"/>
    <rect x="30" y="449" width="328" height="30" rx="6" fill="#b18442"/>
    <text x="133" y="469" fill="#fff8e9" font-family="Arial,sans-serif" font-size="13" font-weight="700">Generate again</text>
  </g>
</svg>
