<style>
:root{color-scheme:dark;--bg:#111018;--bg-deep:#0a0910;--bg-card:#24202a;--gold:#d3b883;--gold-bright:#efe3c7;--gold-muted:#8f7950;--ink:#f2ece0;--ink-soft:#a99f8d;--line:#3a3345}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,var(--bg-card),var(--bg) 62%,var(--bg-deep));color:var(--ink);font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif}
main{max-width:560px;padding:42px 34px;border:1px solid var(--line);border-radius:12px;background:var(--bg-card);text-align:center}
.kicker{margin:0 0 10px;color:var(--gold-muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
h1{margin:0 0 12px;color:var(--gold-bright);font-size:clamp(1.8rem,5.5vw,2.4rem);font-weight:400;letter-spacing:-.01em;line-height:1.15}
p{margin:0 0 26px;color:var(--ink-soft);line-height:1.7}
.links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
a{display:inline-flex;align-items:center;min-height:46px;padding:0 20px;border:1px solid var(--gold-muted);border-radius:999px;color:var(--gold);background:transparent;font-size:.9rem;font-weight:700;letter-spacing:.02em;text-decoration:none}
a.primary{color:var(--bg-deep);background:linear-gradient(180deg,var(--gold-bright),var(--gold))}
a:hover{border-color:var(--gold)}
a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <p class="kicker">Mystic Coin / 404</p>
  <h1>The coin did not land on a page.</h1>
  <p>Ask your question again and flip. Every reading you have already cast stays in this browser.</p>
  <div class="links">

  </div>
</main>
</body>
