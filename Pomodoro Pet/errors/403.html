<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#FFF8F0">
<title>403 | Forbidden | Pomodoro Pet</title>
<meta name="description" content="HTTP 403 error page for Pomodoro Pet. The server understood the request, but access to this address is restricted. Check the address or return to the homepage.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#FFF8F0;--surface:#FFFFFF;--ink:#2f2a3d;--ink-soft:#6b6478;--line:#E5DDF0;--primary:#8B7CF6;--primary-dark:#6658D6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:Nunito,ui-rounded,"Segoe UI",system-ui,sans-serif;line-height:1.65}
main{width:min(100%,520px);padding:36px 30px;border-radius:20px;background:var(--surface);box-shadow:0 4px 16px rgba(139,124,246,.14);text-align:center}
.kicker{margin:0 0 10px;color:var(--primary-dark);font-size:.76rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
h1{margin:0 0 12px;font-size:clamp(1.7rem,5.5vw,2.2rem);letter-spacing:-.02em;line-height:1.2}
p{margin:0 0 26px;color:var(--ink-soft)}
.links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
a{display:inline-flex;align-items:center;min-height:44px;padding:0 22px;border-radius:999px;color:#1b1733;background:var(--primary);font-size:.92rem;font-weight:700;text-decoration:none}
a:hover{background:var(--primary-dark)}
a:focus-visible{outline:3px solid var(--primary-dark);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <p class="kicker">Pomodoro Pet / 403</p>
  <h1>You cannot access this page.</h1>
  <p>The server understood the request, but access to this address is restricted. Check the address or return to the homepage.</p>
  <div class="links">
    <a href="/index.html">Back to your pet</a>
  </div>
</main>
</body>
</html>
