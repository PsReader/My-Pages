<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/x-icon" id="favicon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png">
<meta name="robots" content="noindex, follow">
<title>500 | Internal server error | PS Reader</title>
<meta name="description" content="HTTP 500 error page for PS Reader. The server hit an unexpected problem while opening this page. Try again in a moment.">
<style>
:root{color-scheme:dark light;--bg:#0b0d13;--panel:#12151f;--ink:#e8ecf4;--ink-soft:#98a2b6;--line:#242a38;--accent:#0077b6}
@media(prefers-color-scheme:light){:root{--bg:#eceff5;--panel:#ffffff;--ink:#12151f;--ink-soft:#4d5670;--line:#d4dae6;--accent:#00639b}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.6}
main{max-width:560px;padding:40px 34px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.kicker{margin:0 0 10px;color:var(--accent);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
h1{margin:0 0 12px;font-size:clamp(1.9rem,6vw,2.6rem);letter-spacing:-.03em;line-height:1.1}
p{margin:0 0 26px;color:var(--ink-soft)}
.links{display:flex;flex-wrap:wrap;gap:12px}
a{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:transparent;font-size:.9rem;font-weight:700;text-decoration:none}
a.primary{border-color:var(--accent);color:#fff;background:var(--accent)}
a.primary:hover{filter:brightness(1.12)}
a:hover{border-color:var(--accent)}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <p class="kicker">PS Reader / 500</p>
  <h1>Something went wrong on this page.</h1>
  <p>The server hit an unexpected problem while opening this page. Try again in a moment.</p>
  <div class="links">
    <a class="primary" href="/index.html">Back to the project index</a>
    <a href="/portfolio.html">Portfolio</a>
    <a href="/privacy.html">Privacy</a>
  </div>
</main>
</body>
</html>
