<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Scratchpad — open notebook with ruled pages and an idea spark">
  <title>Scratchpad</title>

  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#26204F"/>
      <stop offset="100%" stop-color="#0D1020"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#8B52FF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#8B52FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7A45E6"/>
      <stop offset="100%" stop-color="#41258F"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#F1E9D8"/>
    </linearGradient>
    <linearGradient id="gutterL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="gutterR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="inkGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D1FF"/>
      <stop offset="100%" stop-color="#8B52FF"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D1FF"/>
      <stop offset="100%" stop-color="#C9F6FF"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="ambientGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ===== Background ===== -->
  <rect x="0" y="0" width="400" height="320" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="400" height="320" fill="url(#glowGrad)"/>

  <!-- ===== Open notebook spread ===== -->
  <g id="notebook" filter="url(#softShadow)">
    <rect x="54" y="54" width="292" height="212" rx="18" fill="url(#coverGrad)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

    <!-- Left + right pages -->
    <rect x="68" y="68" width="128" height="184" rx="14" fill="url(#paperGrad)"/>
    <rect x="204" y="68" width="128" height="184" rx="14" fill="url(#paperGrad)"/>

    <!-- Gutter fold shading -->
    <rect x="182" y="68" width="14" height="184" fill="url(#gutterL)"/>
    <rect x="204" y="68" width="14" height="184" fill="url(#gutterR)"/>

    <!-- Ruled lines -->
    <g stroke="#B7A5E8" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
      <g>
        <line x1="80" y1="106" x2="184" y2="106"/>
        <line x1="80" y1="132" x2="184" y2="132"/>
        <line x1="80" y1="158" x2="184" y2="158"/>
        <line x1="80" y1="184" x2="184" y2="184"/>
        <line x1="80" y1="210" x2="184" y2="210"/>
        <line x1="80" y1="236" x2="184" y2="236"/>
      </g>
      <g>
        <line x1="216" y1="106" x2="320" y2="106"/>
        <line x1="216" y1="132" x2="320" y2="132"/>
        <line x1="216" y1="158" x2="320" y2="158"/>
        <line x1="216" y1="184" x2="320" y2="184"/>
        <line x1="216" y1="210" x2="320" y2="210"/>
        <line x1="216" y1="236" x2="320" y2="236"/>
      </g>
    </g>

    <!-- Margin lines -->
    <g stroke="#E895A8" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round">
      <line x1="92" y1="106" x2="92" y2="236"/>
      <line x1="216" y1="106" x2="216" y2="236"/>
    </g>

    <!-- Ribbon bookmark -->
    <path d="M 190 54 L 190 146 L 200 137 L 210 146 L 210 54 Z" fill="url(#inkGrad)"/>
  </g>

  <!-- ===== Ink stroke + idea spark ===== -->
  <g id="mark">
    <path d="M 262 244 C 264 224, 292 210, 300 186 C 305 168, 302 154, 300 142"
          fill="none" stroke="url(#inkGrad)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="262" cy="244" r="4.5" fill="#00D1FF"/>

    <g transform="translate(300, 126) scale(0.95)">
      <circle cx="0" cy="0" r="26" fill="#00D1FF" opacity="0.3" filter="url(#ambientGlow)"/>
      <path d="M 0 -30 Q 0 0 30 0 Q 0 0 0 30 Q 0 0 -30 0 Q 0 0 0 -30 Z"
            fill="url(#starGrad)" filter="url(#ambientGlow)"/>
    </g>

    <g transform="translate(140, 164) scale(0.5)" opacity="0.9">
      <path d="M 0 -30 Q 0 0 30 0 Q 0 0 0 30 Q 0 0 -30 0 Q 0 0 0 -30 Z"
            fill="#00D1FF"/>
    </g>
  </g>
</svg>
