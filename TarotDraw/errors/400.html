*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:'Libre Baskerville',Georgia,serif}

a{display:inline-flex;align-items:center;min-height:46px;padding:0 22px;border:1px solid var(--gold-soft);border-radius:3px;color:var(--gold);background:transparent;font-size:.9rem;font-weight:700;letter-spacing:.03em;text-decoration:none}
