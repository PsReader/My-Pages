<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#172522">
<title>500 | Internal server error | Pixelpress</title>
<meta name="description" content="HTTP 500 error page for Pixelpress. The server hit an unexpected problem while opening this page. Try again in a moment.">
<link rel="icon" type="image/png" sizes="48x48" href="/pixelpress-favicon-48.png"><link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/pixelpress-mark.svg" sizes="any">
<style>
:root{color-scheme:dark light;--paper:#171816;--panel:#22231f;--ink:#f3f0e8;--ink-soft:#c0baab;--line:#49483f;--accent:#e07b4f}
@media(prefers-color-scheme:light){:root{--paper:#f3f0e8;--panel:#fbfaf6;--ink:#17201f;--ink-soft:#50615d;--line:#c8c8bc;--accent:#c85c35}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:'Helvetica Neue',Helvetica,Arial,system-ui,sans-serif}
main{width:min(100%,560px);padding:36px 32px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:0 14px 38px rgba(25,37,32,.12)}
.kicker{margin:0 0 10px;color:var(--accent);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
h1{margin:0 0 10px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;font-weight:400;font-size:clamp(1.8rem,5.5vw,2.4rem);letter-spacing:-.04em;line-height:1.12}
p{margin:0 0 26px;color:var(--ink-soft);line-height:1.6}
.links{display:flex;flex-wrap:wrap;gap:10px}
a{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:transparent;font-size:.88rem;font-weight:700;text-decoration:none}
a.primary{border-color:var(--accent);color:var(--paper);background:var(--accent)}
a:hover{border-color:var(--accent)}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <p class="kicker">Pixelpress / 500</p>
  <h1>Something went wrong on this page.</h1>
  <p>The server hit an unexpected problem while opening this page. Try again in a moment.</p>
  <div class="links">
    <a class="primary" href="/index.html">Back to the compressor</a>
  </div>
</main>
</body>
</html>
