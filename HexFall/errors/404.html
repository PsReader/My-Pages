<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#101418">
<title>404 | Not found | Hexfall</title>
<meta name="description" content="That corridor is a dead end. Return to the Hexfall expedition map.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--ink:#101418;--deep:#0a0d10;--stone:#252c31;--line:#333b40;--moon:#e8e3d4;--mist:#9aa6a5;--ember:#e46f45;--gold:#d5b56c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--deep);color:var(--moon);font-family:'DM Sans',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
main{width:min(100%,560px);padding:36px 32px;border:1px solid var(--line);border-radius:14px;background:var(--ink)}
.kicker{margin:0 0 10px;color:var(--gold);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
h1{margin:0 0 10px;font-weight:600;font-size:clamp(1.8rem,5.5vw,2.4rem);letter-spacing:-.03em;line-height:1.14}
p{margin:0 0 26px;color:var(--mist);line-height:1.6}
.links{display:flex;flex-wrap:wrap;gap:10px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:8px;color:var(--moon);background:transparent;font-size:.88rem;font-weight:600;text-decoration:none}
a.primary{border-color:var(--ember);color:var(--deep);background:var(--ember)}
a:hover{border-color:var(--ember)}
a:focus-visible{outline:3px solid var(--ember);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <p class="kicker">Hexfall / 404</p>
  <h1>That corridor is a dead end.</h1>
  <p>Your save and your meta shards are untouched. The expedition map is where you left it.</p>
  <div class="links">
    <a class="primary" href="/index.html">Back to the expedition map</a>
  </div>
</main>
</body>
</html>
