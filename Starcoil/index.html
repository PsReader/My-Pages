<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);let W=0,H=0,D=1,world={w:2100,h:1500};
const COLORS=['#72f6ff','#ff6fcb','#b194ff','#ffcf70','#7affbe'];const MAX_LENGTH=160;const storageGet=(key,fallback='')=>{try{return localStorage.getItem(key)??fallback}catch(_){return fallback}},storageSet=(key,value)=>{try{localStorage.setItem(key,String(value))}catch(_){}},storedBest=Number(storageGet('starcoil-best',0)),storedSensitivity=Number(storageGet('starcoil-sensitivity',''));let state='title',last=0,elapsed=0,score=0,best=Number.isFinite(storedBest)&&storedBest>=0?storedBest:0,crownTime=0,captures=0,survived=0,toastTimer=0,shake=0,boost=100,boosting=false,musicOn=storageGet('starcoil-music')!=='off',soundOn=storageGet('starcoil-sound')!=='off',keys={},mouse={x:0,y:0,active:false},touchAim=null,gamepadAim=null,steerMode='none',showTutorial=!storageGet('starcoil-tutorial'),sensitivity=Number.isFinite(storedSensitivity)&&storedSensitivity>0?storedSensitivity:1.25,controlScheme=['arrows','wasd'].includes(storageGet('starcoil-layout'))?storageGet('starcoil-layout'):'arrows',settingsReturn='title',runNewBest=false,gamepadPauseLatch=false,padBoost=false,hazardsSurvived=0,player,bots=[],orbs=[],hazards=[],powerups=[],particles=[],camera={x:0,y:0},milestone=0,worldTime=0,shellCharges=0,shellTime=0,bloomTime=0,novaCharges=0,novaCooldown=0,novaPulseTime=0,novaPulseRadius=0,powerupSpawnTimer=3.5,powerupCycle=0,collisionGrace=0,shellBreakFlash=0;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',()=>{resize();enforceOrientationPause()});addEventListener('orientationchange',enforceOrientationPause);resize();

function moveOutsidePlayerRadius(item,radius,minMargin){let tries=0;while(Math.hypot(item.x-player.x,item.y-player.y)<radius&&tries++<20){item.x=minMargin+rand()*(world.w-minMargin*2);item.y=minMargin+rand()*(world.h-minMargin*2)}if(Math.hypot(item.x-player.x,item.y-player.y)>=radius)return;let candidates=[[minMargin,minMargin],[world.w-minMargin,minMargin],[minMargin,world.h-minMargin],[world.w-minMargin,world.h-minMargin],[world.w/2,minMargin],[world.w/2,world.h-minMargin],[minMargin,world.h/2],[world.w-minMargin,world.h/2]];let best=candidates[0],bestDistance=-Infinity;for(let candidate of candidates){let distance=Math.hypot(candidate[0]-player.x,candidate[1]-player.y);if(distance>bestDistance){bestDistance=distance;best=candidate}}item.x=best[0];item.y=best[1]}function populate(){orbs=[];hazards=[];bots=[];particles=[];for(let i=0;i<200;i++)orbs.push({x:rand()*world.w,y:rand()*world.h,r:3+rand()*4,val:8+Math.floor(rand()*18),color:COLORS[Math.floor(rand()*COLORS.length)],kind:rand()<.08?'comet':'mote',vx:(rand()-.5)*24,vy:(rand()-.5)*24,phase:rand()*8});for(let i=0;i<14;i++){let types=['mine','flare','eddy','asteroid'];hazards.push({x:90+rand()*(world.w-180),y:90+rand()*(world.h-180),r:types[i%4]==='asteroid'?26+rand()*17:types[i%4]==='eddy'?41:types[i%4]==='flare'?29:18,type:types[i%4],phase:rand()*6,angle:rand()*6.28})}for(let i=0;i<5;i++)bots.push(worm(180+rand()*(world.w-360),180+rand()*(world.h-360),['Vesper','Comet','Mallow','Nyx','Orbit'][i],COLORS[(i+1)%COLORS.length],false,9+Math.floor(rand()*6)));player=worm(world.w/2,world.h/2,'You',COLORS[0],true,8);for(let h of hazards)moveOutsidePlayerRadius(h,180,90);for(let b of bots){moveOutsidePlayerRadius(b,260,180);b.segments=Array.from({length:b.targetLen},(_,i)=>({x:b.x-Math.cos(b.angle)*i*10,y:b.y-Math.sin(b.angle)*i*10}))}}
