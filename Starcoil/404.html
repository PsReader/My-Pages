<!doctype html>
<html lang="en">

      p { color: #a6afd1; line-height: 1.65; }
      .eyebrow { color: #6cf6ff; font-size: .8rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 12px 0; font-size: clamp(2rem, 8vw, 3.4rem); line-height: 1.05; }
      a { display: inline-flex; min-height: 48px; align-items: center; margin-top: 12px; padding: 0 18px; border-radius: 12px; background: #6cf6ff; color: #091324; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #ffd67b; outline-offset: 3px; }
